services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrims
      POSTGRES_PASSWORD: scrims
      POSTGRES_DB: scrimsbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      # inside compose, the DB host is the postgres service
      DATABASE_URL: postgresql://scrims:scrims@postgres:5432/scrimsbot?schema=public
    command: sh -c "npx prisma migrate deploy && node src/index.js"

volumes:
  pgdata:
